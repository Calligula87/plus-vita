name: Vita smoke build

on:
  push:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "external/freetype"
      - "vita-client/**"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-account-integration.sh"
      - "tools/test-app-text.sh"
      - "tools/test-app-font.sh"
      - "tools/test-app-catalogue.sh"
      - "tools/test-app-recovery.sh"
      - "tools/test-app-branding.sh"
      - "tools/test-deferred-log.sh"
      - "tools/test-app-covers.sh"
      - "tools/test-app-freetype.sh"
  pull_request:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "external/freetype"
      - "vita-client/**"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-account-integration.sh"
      - "tools/test-app-text.sh"
      - "tools/test-app-font.sh"
      - "tools/test-app-catalogue.sh"
      - "tools/test-app-recovery.sh"
      - "tools/test-app-branding.sh"
      - "tools/test-deferred-log.sh"
      - "tools/test-app-covers.sh"
      - "tools/test-app-freetype.sh"
  workflow_dispatch:

jobs:
  app-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test native application workflow
        run: sh tools/test-app-workflow.sh
      - name: Test app text output and bounds
        run: sh tools/test-app-text.sh
      - name: Test real font adapter and menu painting
        run: sh tools/test-app-font.sh
      - name: Test native account worker with simulated Sony responses
        run: sh tools/test-app-account-integration.sh
      - name: Test catalogue search and details
        run: sh tools/test-app-catalogue.sh
      - name: Test allocation cancellation and recovery
        run: sh tools/test-app-recovery.sh
      - name: Test startup splash and welcome branding
        run: sh tools/test-app-branding.sh
      - name: Test privacy schema and bounded deferred persistence
        run: sh tools/test-deferred-log.sh
      - name: Test bounded asynchronous artwork and HTTP policy
        run: sh tools/test-app-covers.sh
      - name: Test real FreeType output and synthetic comparison journey
        run: sh tools/test-app-freetype.sh

  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    strategy:
      matrix:
        include:
          - diagnostic: "OFF"
            comparison: "OFF"
            release: "ON"
          - diagnostic: "ON"
            comparison: "OFF"
            release: "OFF"
          - diagnostic: "OFF"
            comparison: "ON"
            release: "OFF"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Allow Git reads of the mounted checkout
        # checkout's temporary HOME does not persist into container run steps.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify source and history before building
        if: matrix.release == 'ON'
        run: python3 tools/publication_gate.py

      - name: Configure
        run: >-
          cmake -S vita-client -B build/vita -DCMAKE_BUILD_TYPE=Release
          -DPLUS_VITA_DIAGNOSTIC_APP=${{ matrix.diagnostic }}
          -DPLUS_VITA_FONT_COMPARISON=${{ matrix.comparison }}
          -DPLUS_VITA_FONT_DEFAULT_FREETYPE=ON
          -DPLUS_VITA_RELEASE_CANDIDATE=${{ matrix.release }}

      - name: Build VPK
        run: cmake --build build/vita --parallel

      - name: Verify package
        run: test -s build/vita/plus_vita_smoke.vpk
      - name: Verify anonymous package and synthetic leak rejection
        if: matrix.release == 'ON'
        run: |
          python3 tools/publication_gate.py --vpk build/vita/plus_vita_smoke.vpk
          python3 tools/test-publication-gate.py build/vita/plus_vita_smoke.vpk
      # Publishing a downloadable VPK remains gated by the privacy audit in #22.
