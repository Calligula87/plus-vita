name: Vita smoke build

on:
  push:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "vita-client/**"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-account-integration.sh"
  pull_request:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "vita-client/**"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-account-integration.sh"
  workflow_dispatch:

jobs:
  app-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test native application workflow
        run: sh tools/test-app-workflow.sh
      - name: Test native account worker with simulated Sony responses
        run: sh tools/test-app-account-integration.sh

  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    strategy:
      matrix:
        diagnostic: ["OFF", "ON"]
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S vita-client -B build/vita -DCMAKE_BUILD_TYPE=Release
          -DPLUS_VITA_DIAGNOSTIC_APP=${{ matrix.diagnostic }}

      - name: Build VPK
        run: cmake --build build/vita --parallel

      - name: Verify package
        run: test -s build/vita/plus_vita_smoke.vpk

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: plus-vita-diagnostic-${{ matrix.diagnostic }}
          path: build/vita/plus_vita_smoke.vpk
          if-no-files-found: error
